name: Kernel Build (Neutron Clang)

on:
  push:
    branches:
      - 16-disablet
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bc ccache binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            build-essential cpio zip unzip git flex bison python3 zstd curl \
            lld llvm clang
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: Setup Neutron Clang
        id: neutron
        run: |
          set -e
          echo "🔧 Setting up Neutron Clang..."
          mkdir -p "$HOME/toolchains"
          cd "$HOME/toolchains"

          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S || true

          echo "🔎 Probing for Neutron Clang directories..."
          # Candidate roots to search (common antman layouts)
          CANDIDATES=(
            "$PWD"
            "$PWD/clang"
            "$PWD/neutron-clang"
          )

          # Add any neutron-* dirs to candidates
          for d in "$PWD"/neutron-* "$PWD"/clang-*; do
            [ -d "$d" ] && CANDIDATES+=("$d")
          done

          # Search for a directory that contains bin/clang
          CLANG_DIR=""
          for root in "${CANDIDATES[@]}"; do
            match=$(find "$root" -maxdepth 3 -type d -name bin -exec test -x "{}"/clang \; -print 2>/dev/null | head -n1)
            if [ -n "$match" ]; then
              CLANG_DIR=$(dirname "$match")
              break
            fi
          done

          if [ -z "$CLANG_DIR" ]; then
            echo "❌ Neutron Clang not found in expected locations."
            echo "📂 Directory listing for debugging:"
            echo ">> $PWD"
            ls -la "$PWD" || true
            if [ -d "$PWD/clang" ]; then
              echo ">> $PWD/clang"
              ls -la "$PWD/clang" || true
            fi
            echo "🧭 Deep search (may be slow)..."
            match=$(find "$PWD" -maxdepth 8 -type d -name bin -exec test -x "{}"/clang \; -print 2>/dev/null | head -n1)
            if [ -n "$match" ]; then
              CLANG_DIR=$(dirname "$match")
            fi
          fi

          if [ -z "$CLANG_DIR" ]; then
            echo "⚠️ Falling back to system LLVM/Clang (AOSP-like) to proceed."
            # Use system clang/lld installed earlier
            echo "clang_dir=/usr" >> "$GITHUB_OUTPUT"
          else
            echo "✅ Using CLANG_DIR: $CLANG_DIR"
            echo "clang_dir=$CLANG_DIR" >> "$GITHUB_OUTPUT"
          fi

      - name: Show toolchain info
        run: |
          export PATH="${{ steps.neutron.outputs.clang_dir }}/bin:$PATH"
          echo "PATH: $PATH"
          clang --version || true
          ld.lld --version || true

      - name: Build kernel
        env:
          PATH: ${{ steps.neutron.outputs.clang_dir }}/bin:$PATH
          CLANG_DIR: ${{ steps.neutron.outputs.clang_dir }}
          TC_DIR: ${{ steps.neutron.outputs.clang_dir }}
        run: |
          set -e
          chmod +x build.sh
          mkdir -p out
          echo "🚀 Starting kernel build..."
          ./build.sh

      - name: Upload flashable zip
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: Rectilia-vayu-${{ github.run_number }}-zip
          path: ./*.zip

      - name: Upload raw kernel outputs
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: Rectilia-vayu-${{ github.run_number }}-raw
          path: |
            out/arch/arm64/boot/Image*
            out/arch/arm64/boot/dtbo.img
          if-no-files-found: ignore
