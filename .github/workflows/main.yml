name: Kernel Build (Neutron Clang)

on:
  push:
    branches:
      - '*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout source
        uses: actions/checkout@v4

      - name: 🧰 Set up build environment
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            bc ccache binutils-aarch64-linux-gnu cpio zip unzip git flex bison \
            libssl-dev build-essential libncurses5-dev

          # Ensure python is available (for old scripts)
          sudo apt-get install -y python3
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: ⚙️ Run build script
        run: |
          chmod +x build.sh
          ./build.sh

      - name: 📦 Upload built zip
        uses: actions/upload-artifact@v4
        with:
          name: Built-Kernel
          path: /workspace/*.zip
