name: Kernel Build (Neutron Clang)

on:
  push:
    branches:
      - 16-disablet
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bc ccache binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            build-essential cpio zip unzip git flex bison python3 zstd curl
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: Setup Neutron Clang
        id: neutron
        run: |
          echo "🔧 Setting up Neutron Clang..."
          mkdir -p $HOME/toolchains && cd $HOME/toolchains
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S

          # Detect extracted folder (handles neutron-clang-YYYYMMDD style)
          CLANG_DIR=$(realpath "$(find "$PWD" -maxdepth 1 -type d -name "neutron-*" | head -n1)")

          if [ -z "$CLANG_DIR" ]; then
            echo "❌ Neutron Clang not found!"
            exit 1
          fi

          echo "clang_dir=$CLANG_DIR" >> $GITHUB_OUTPUT
          echo "✅ Clang: $CLANG_DIR"

      - name: Show toolchain info
        run: |
          export PATH="${{ steps.neutron.outputs.clang_dir }}/bin:$PATH"
          clang --version || true

      - name: Build kernel
        env:
          PATH: ${{ steps.neutron.outputs.clang_dir }}/bin:$PATH
          CLANG_DIR: ${{ steps.neutron.outputs.clang_dir }}
          TC_DIR: ${{ steps.neutron.outputs.clang_dir }}
        run: |
          chmod +x build.sh
          mkdir -p out
          echo "🚀 Starting kernel build..."
          ./build.sh

      - name: Upload built kernel
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: Rectilia-vayu-${{ github.run_number }}
          path: ./*.zip
