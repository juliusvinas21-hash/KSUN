name: Kernel Build (Neutron Clang)

on:
  push:
    branches:
      - 16-disablet
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bc ccache binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            build-essential cpio zip unzip git flex bison python3 zstd curl
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: Setup Neutron Clang
        id: neutron
        run: |
          echo "🔧 Setting up Neutron Clang..."
          mkdir -p $HOME/toolchains && cd $HOME/toolchains
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S

          # Detect layout
          if [ -d "neutron-clang/bin" ]; then
            CLANG_DIR="$PWD/neutron-clang"
          elif [ -d "bin" ] && [ -f "build.info" ]; then
            CLANG_DIR="$PWD"
          else
            CLANG_DIR=$(find . -maxdepth 1 -type d -name "neutron-*" | head -n1)
            if [ -z "$CLANG_DIR" ]; then
              echo "❌ No neutron-clang directory found!" >&2
              ls -la
              exit 1
            fi
          fi

          echo "✅ Neutron Clang ready at: $CLANG_DIR"
          echo "clang_dir=$CLANG_DIR" >> $GITHUB_OUTPUT

      - name: Show toolchain info
        run: |
          export PATH="${{ steps.neutron.outputs.clang_dir }}/bin:$PATH"
          clang --version || true
          df -h

      - name: Build kernel
        shell: bash
        env:
          PATH: ${{ steps.neutron.outputs.clang_dir }}/bin:$PATH
          CLANG_DIR: ${{ steps.neutron.outputs.clang_dir }}
          TC_DIR: ${{ steps.neutron.outputs.clang_dir }}
        run: |
          chmod +x build.sh
          mkdir -p out
          echo "🚀 Starting kernel build..."
          ./build.sh

      - name: Upload built kernel
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ github.ref_name }}-${{ github.run_number }}
          path: out/*.zip
