name: Kernel Build (Neutron Clang)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bc ccache binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            build-essential cpio zip unzip git flex bison python3 zstd curl \
            lld llvm clang
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: Setup Neutron Clang
        id: neutron
        run: |
          set -e
          echo "🔧 Setting up Neutron Clang..."
          mkdir -p "$HOME/toolchains"
          cd "$HOME/toolchains"

          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S || true

          echo "🔎 Probing for Neutron Clang directories..."
          CANDIDATES=( "$PWD" "$PWD/clang" "$PWD/neutron-clang" )
          for d in "$PWD"/neutron-* "$PWD"/clang-*; do
            [ -d "$d" ] && CANDIDATES+=("$d")
          done

          CLANG_DIR=""
          for root in "${CANDIDATES[@]}"; do
            match=$(find "$root" -maxdepth 3 -type d -name bin -exec test -x "{}"/clang \; -print 2>/dev/null | head -n1)
            if [ -n "$match" ]; then
              CLANG_DIR=$(dirname "$match")
              break
            fi
          done

          if [ -z "$CLANG_DIR" ]; then
            echo "🧭 Deep search..."
            match=$(find "$PWD" -maxdepth 8 -type d -name bin -exec test -x "{}"/clang \; -print 2>/dev/null | head -n1)
            if [ -n "$match" ]; then
              CLANG_DIR=$(dirname "$match")
            fi
          fi

          if [ -z "$CLANG_DIR" ]; then
            echo "⚠️ Falling back to system LLVM/Clang to proceed."
            echo "clang_dir=/usr" >> "$GITHUB_OUTPUT"
          else
            echo "✅ Using CLANG_DIR: $CLANG_DIR"
            echo "clang_dir=$CLANG_DIR" >> "$GITHUB_OUTPUT"
          fi

      - name: Show toolchain info and derive cache key
        id: toolinfo
        run: |
          export PATH="${{ steps.neutron.outputs.clang_dir }}/bin:$PATH"
          echo "PATH: $PATH"
          test -x "${{ steps.neutron.outputs.clang_dir }}/bin/clang" || (echo "Neutron Clang not found at ${{ steps.neutron.outputs.clang_dir }}; aborting"; exit 1)
          clang --version || true
          ld.lld --version || true

          # Derive a cache key suffix from clang version (stable across runs with same toolchain)
          ver=$(clang --version 2>/dev/null | head -n1 | tr -s ' ' '_' || echo "system_clang")
          echo "ver=$ver" >> "$GITHUB_OUTPUT"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ steps.toolinfo.outputs.ver }}-${{ github.ref }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ steps.toolinfo.outputs.ver }}-
            ccache-${{ runner.os }}-

      - name: Configure ccache
        run: |
          mkdir -p ~/.ccache
          ccache --version || true
          ccache --set-config cache_dir="$HOME/.ccache"
          ccache --set-config max_size=5G
          ccache --set-config compression=true
          ccache --show-config || true

      - name: Build kernel
        env:
          CLANG_DIR: ${{ steps.neutron.outputs.clang_dir }}
          TC_DIR: ${{ steps.neutron.outputs.clang_dir }}
          CCACHE_DIR: ${{ runner.temp }}/.ccache
        run: |
          set -e
          # Prepend toolchain to PATH without losing system paths
          export PATH="${CLANG_DIR}/bin:$PATH"

          # Ensure ccache dir exists (use home cache, but keep env var explicit)
          export CCACHE_DIR="$HOME/.ccache"

          # Sanity checks
          which chmod
          which clang
          which ld.lld
          which ccache

          chmod +x build.sh
          mkdir -p out
          echo "🚀 Starting kernel build..."
          ./build.sh

      - name: Show ccache stats
        run: |
          ccache -s || true

      - name: Upload flashable zip
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: Rectilia-vayu-${{ github.run_number }}-zip
          path: ./*.zip

      - name: Upload raw kernel outputs
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: Rectilia-vayu-${{ github.run_number }}-raw
          path: |
            out/arch/arm64/boot/Image*
            out/arch/arm64/boot/dtbo.img
          if-no-files-found: ignore
