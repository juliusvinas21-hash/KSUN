name: Build Vayu Kernel (Neutron Clang)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v3

    - name: Set Swap (Avoid OOM)
      uses: pierotofy/set-swap-space@v1.0
      with:
        swap-size-gb: 10

    - name: Setup Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git bc python2 ccache binutils-aarch64-linux-gnu cpio

    - name: Download Neutron Clang
      run: |
        mkdir -p tc
        cd tc
        git clone --depth=1 https://github.com/Neutron-Toolchains/clang.git neutron-clang
        cd ..

    - name: Grant Build Script Permission
      run: chmod +x build.sh

    - name: Run Build Script
      run: |
        export PATH="$GITHUB_WORKSPACE/tc/neutron-clang/bin:$PATH"
        ./build.sh

    - name: Upload Kernel ZIP
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Zip
        path: "*.zip"
