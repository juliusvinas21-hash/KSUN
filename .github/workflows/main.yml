name: Kernel Build (Neutron Clang)

on:
  push:
    branches:
      - '*'          # run on all branches
  workflow_dispatch: # allow manual trigger from Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare build environment
        run: |
          sudo apt-get update -y
          sudo apt-get install -y bc python2 ccache binutils-aarch64-linux-gnu cpio zip unzip git flex bison

      - name: Set up Neutron Clang (auto-handled)
        run: |
          mkdir -p $HOME/tc
          if [ ! -d "$HOME/tc/neutron-clang" ]; then
            echo "==> Downloading Neutron Clang..."
            git clone --depth=1 https://github.com/Neutron-Clang/neutron-clang.git $HOME/tc/neutron-clang
          fi
          export PATH="$HOME/tc/neutron-clang/bin:$PATH"
          echo "Neutron Clang installed at $HOME/tc/neutron-clang"

      - name: Run build.sh
        run: |
          chmod +x build.sh
          mkdir -p /workspace
          bash build.sh

      - name: Upload build artifact (kernel zip)
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Zip
          path: /workspace/*.zip
