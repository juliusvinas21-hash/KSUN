name: Kernel Build (Neutron Clang)

on:
  push:
    branches:
      - 16-disablet
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare runner
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bc ccache binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            build-essential cpio zip unzip git flex bison python3 zstd curl
          sudo ln -sf /usr/bin/python3 /usr/bin/python
          echo "✅ System ready"

      - name: Free space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          df -h

      - name: Install Neutron Clang
        id: neutron
        shell: bash
        run: |
          mkdir -p $HOME/toolchains/neutron-clang
          cd $HOME/toolchains/neutron-clang
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S

          CLANG_DIR=$(find . -maxdepth 1 -type d -name "neutron-*" | head -n1)
          mv -f "$CLANG_DIR" clang
          CLANG_DIR="$PWD/clang"
          echo "clang_dir=$CLANG_DIR" >> $GITHUB_OUTPUT
          echo "✅ Neutron Clang ready at: $CLANG_DIR"

      - name: Show clang info
        shell: bash
        run: |
          export PATH="${{ steps.neutron.outputs.clang_dir }}/bin:$PATH"
          clang --version

      - name: Build kernel
        shell: bash
        run: |
          echo "==> Starting build..."
          chmod +x build.sh
          export CLANG_DIR="${{ steps.neutron.outputs.clang_dir }}"
          export PATH="$CLANG_DIR/bin:$PATH"
          ./build.sh

      - name: Upload output
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ github.ref_name }}-${{ github.run_number }}
          path: |
            out/*.zip
            workspace/*.zip
            *.zip
